<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Données CSV</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="dashboard-page">

    <div class="sidebar">
        <h2>Menu</h2>
        <nav>
            <a href="accueil.html">🏠 Accueil</a>
            <a href="projet.html" class="active">📊 Données CSV</a>
            <a href="stats.html" id="linkStats">📈 Statistiques</a>
            <a href="complexe.html" id="linkComplexe">🌟 Données membres</a>
            <a href="param.html">⚙️ Paramètres</a>
        </nav>
    </div>

    <main class="main-content">
        <div class="table-page-container">
            <h1 class="page-title">Tableau de Données</h1>
            
            <div class="filtres">
                <div class="filtregroupe">
                    <label>Charger un CSV</label>
                    <input type="file" id="csvFileInput" accept=".csv">
                </div>
                <div class="filtregroupe">
                    <label>Rechercher</label>
                    <input type="text" id="searchBar" placeholder="Tapez pour filtrer...">
                </div>
            </div>

            <div id="tableauContainer">
                <p style="text-align:center; padding:20px; color:#777;">En attente d'un fichier...</p>
            </div>

            <div id="paginationControls" class="pagination" style="display:none;">
                <button id="btnPrev">Précédent</button>
                <span id="pageInfo">Page 1</span>
                <button id="btnNext">Suivant</button>
            </div>
        </div>
    </main>

    <script>
        // --- 1. SÉCURITÉ MENU ---
        fetch('/api/session').then(r=>r.json()).then(d => {
            const linkStats = document.getElementById('linkStats');
            const linkComplexe = document.getElementById('linkComplexe');
            
            if(!d.loggedIn) {
                if(linkStats) linkStats.style.display='none';
                if(linkComplexe) linkComplexe.style.display='none';
            } else {
                if (d.user.role !== 'admin' && linkComplexe) {
                    linkComplexe.style.display='none';
                }
            }
        });

        // --- 2. TRAITEMENT CSV ---
        let allData = [], filteredData = [], columns = []; 
        let state = { page: 1, rowsPerPage: 50, sortCol: null, sortAsc: true };

        // Dictionnaire de traduction (Anglais CSV -> Français Affichage)
        const traductions = {
            "title": "Titre",
            "image": "Image",
            "Type": "Type",
            "Episodes": "Épisodes",
            "Status": "Statut",
            "Premiered": "Saison de sortie",
            "Released_Season": "Saison",
            "Released_Year": "Année",
            "Genres": "Genres",
            "Themes": "Thèmes",
            "Studios": "Studios",
            "Producers": "Producteurs",
            "Demographic": "Cible",
            "Rating": "Classification",
            "Score": "Note",
            "Ranked": "Rang",
            "Popularity": "Popularité",
            "Members": "Membres",
            "Favorites": "Favoris"
        };

        function csvToJson(str) {
            const rows = str.trim().split('\n');
            if (rows.length === 0) return { data: [], columns: [] };

            function parseLine(text) {
                const values = []; let currentVal = ""; let inQuotes = false;
                for (let i=0; i<text.length; i++) {
                    const char = text[i];
                    if (char === '"') inQuotes = !inQuotes;
                    else if (char === ',' && !inQuotes) { values.push(currentVal); currentVal = ""; }
                    else currentVal += char;
                }
                values.push(currentVal); return values;
            }

            const headers = parseLine(rows[0]).map(h => h.trim().replace(/^"|"$/g, ''));
            const result = [];
            for (let i=1; i<rows.length; i++) {
                const rowStr = rows[i].trim(); if(!rowStr) continue;
                const values = parseLine(rowStr); const obj = {};
                headers.forEach((h, i) => {
                    let val = values[i] ? values[i].trim() : "";
                    val = val.replace(/^"|"$/g, '').replace(/""/g, '"');
                    obj[h] = val;
                });
                result.push(obj);
            }
            return { data: result, columns: headers };
        }

        const fileInput = document.getElementById("csvFileInput");
        if(fileInput) {
            fileInput.addEventListener("change", function(e) {
                const file = e.target.files[0]; if(!file) return;
                const reader = new FileReader();
                reader.readAsText(file);
                reader.onload = function(evt) {
                    const parsed = csvToJson(evt.target.result);
                    allData = parsed.data; columns = parsed.columns;
                    
                    try {
                        sessionStorage.setItem('myDashboardData', JSON.stringify(allData));
                        alert("Données chargées !");
                    } catch(err) {
                        try {
                            const sample = allData.slice(0, 10000);
                            sessionStorage.setItem('myDashboardData', JSON.stringify(sample));
                            alert("Fichier lourd : 10000 lignes conservées.");
                        } catch(e2) {}
                    }

                    if(allData.length > 0) { filteredData = [...allData]; updateTable(); }
                };
            });
        }

        const searchBar = document.getElementById("searchBar");
        if(searchBar) {
            searchBar.addEventListener("keyup", function(e) {
                const txt = e.target.value.toLowerCase();
                filteredData = allData.filter(r => Object.values(r).some(v => String(v).toLowerCase().includes(txt)));
                state.page = 1; updateTable();
            });
        }

        const btnPrev = document.getElementById("btnPrev");
        const btnNext = document.getElementById("btnNext");
        if(btnPrev) btnPrev.addEventListener("click", () => changePage(-1));
        if(btnNext) btnNext.addEventListener("click", () => changePage(1));

        function changePage(d) {
            const max = Math.ceil(filteredData.length/state.rowsPerPage);
            if(state.page+d >= 1 && state.page+d <= max) { state.page+=d; updateTable(); }
        }

        function sortData(col) {
            if (state.sortCol === col) state.sortAsc = !state.sortAsc; 
            else { state.sortCol = col; state.sortAsc = true; }
            filteredData.sort((a, b) => {
                let valA = a[col]||"", valB = b[col]||"";
                const numA = parseFloat(valA), numB = parseFloat(valB);
                if (!isNaN(numA) && !isNaN(numB)) return state.sortAsc ? numA-numB : numB-numA;
                return state.sortAsc ? String(valA).localeCompare(String(valB)) : String(valB).localeCompare(String(valA));
            });
            updateTable();
        }

        function updateTable() {
            const container = document.getElementById("tableauContainer");
            const pag = document.getElementById("paginationControls");
            if(filteredData.length===0) { container.innerHTML="<p style='text-align:center; padding:20px'>Aucune donnée.</p>"; pag.style.display="none"; return; }
            pag.style.display="flex";
            
            const start=(state.page-1)*state.rowsPerPage;
            const data=filteredData.slice(start, start+state.rowsPerPage);
            const total=Math.ceil(filteredData.length/state.rowsPerPage);
            document.getElementById("pageInfo").innerText = `Page ${state.page} / ${total} (${filteredData.length})`;
            
            container.innerHTML = "";
            const table = document.createElement("table");
            const thead = document.createElement("thead");
            const tbody = document.createElement("tbody");
            const trHead = document.createElement("tr");

            columns.forEach(col => {
                // MODIFICATION ICI : On utilise la traduction si elle existe, sinon le nom original
                const label = traductions[col] || col; 
                
                const th = document.createElement("th");
                // On ajoute la flèche de tri à côté du nom traduit
                th.textContent = label + (col === state.sortCol ? (state.sortAsc ? " ▲" : " ▼") : "");
                th.style.cursor = "pointer";
                // Important : on continue de trier avec 'col' (la clé anglaise) pour que la logique marche
                th.addEventListener("click", () => sortData(col));
                trHead.appendChild(th);
            });
            thead.appendChild(trHead);

            data.forEach(row => {
                const tr = document.createElement("tr");
                columns.forEach(col => {
                    const td = document.createElement("td");
                    let val = row[col] || "";
                    
                    // Si c'est une image, on affiche une miniature (optionnel mais sympa)
                    if(col === "image" && val.startsWith("http")) {
                        td.innerHTML = `<img src="${val}" style="height:30px; border-radius:4px;">`;
                    } else {
                        if(val.length > 50 && !val.startsWith("http")) val = val.substring(0,50)+"...";
                        td.textContent = val;
                    }
                    tr.appendChild(td);
                });
                tbody.appendChild(tr);
            });
            table.appendChild(thead); table.appendChild(tbody); container.appendChild(table);
        }

        window.addEventListener('DOMContentLoaded', () => {
            const saved = sessionStorage.getItem('myDashboardData');
            if(saved) { 
                try { allData = JSON.parse(saved); columns = Object.keys(allData[0]); filteredData=[...allData]; updateTable(); } 
                catch(e){} 
            }
        });
    </script>
</body>
</html>
