<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Données CSV</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="dashboard-page">

    <div class="sidebar">
        <h2>Menu</h2>
        <nav>
            <a href="accueil.html">🏠 Accueil</a>
            <a href="projet.html" class="active">📊 Données CSV</a>
            <a href="stats.html" id="linkStats">📈 Statistiques</a>
            <a href="complexe.html" id="linkComplexe">🌟 Complexe</a>
            <a href="/api/logout" id="btnLogout" style="margin-top:20px; color:#e74c3c; display:none;">🚪 Déconnexion</a>
        </nav>
    </div>

    <main class="main-content">
        <div class="table-page-container">
            <h1 class="page-title">Tableau de Données</h1>
            
            <div class="controls">
                <div class="control-group">
                    <label>Charger un CSV</label>
                    <input type="file" id="csvFileInput" accept=".csv">
                </div>
                <div class="control-group">
                    <label>Rechercher</label>
                    <input type="text" id="searchBar" placeholder="Tapez pour filtrer...">
                </div>
            </div>

            <div id="tableauContainer">
                <p style="text-align:center; padding:20px; color:#777;">En attente d'un fichier...</p>
            </div>

            <div id="paginationControls" class="pagination" style="display:none;">
                <button id="btnPrev">Précédent</button>
                <span id="pageInfo">Page 1</span>
                <button id="btnNext">Suivant</button>
            </div>
        </div>
    </main>

    <script>
        // --- 1. GESTION DES ROLES (Visiteur / User / Admin) ---
        // On demande au serveur "C'est qui qui est connecté ?"
        fetch('/api/session').then(r=>r.json()).then(d => {
            const linkStats = document.getElementById('linkStats');
            const linkComplexe = document.getElementById('linkComplexe');
            const btnLogout = document.getElementById('btnLogout');

            // On vérifie que les liens existent bien dans la page avant de changer leur style
            if(linkStats && linkComplexe && btnLogout) {
                if(!d.loggedIn) {
                    // C'est un VISITEUR : on cache les stats et le complexe
                    linkStats.style.display='none';
                    linkComplexe.style.display='none';
                } else {
                    // C'est un MEMBRE : on affiche le bouton déconnexion
                    btnLogout.style.display = 'block';
                    // Si c'est un User normal (pas admin), on cache la page complexe
                    if (d.user.role !== 'admin') {
                        linkComplexe.style.display='none';
                    }
                }
            }
        });

        // --- 2. LOGIQUE DU TABLEAU CSV ---
        let allData = [];
        let filteredData = [];
        let columns = []; 
        let state = { page: 1, rowsPerPage: 50, sortCol: null, sortAsc: true };

        // Fonction pour transformer le texte du CSV en objets JSON utilisables
        function csvToJson(str) {
            const rows = str.trim().split('\n'); // On coupe ligne par ligne
            if (rows.length === 0) return { data: [], columns: [] };

            // Petite fonction pour gérer les virgules qui sont DANS les guillemets (ex: "Action, Drame")
            function parseLine(text) {
                const values = []; let currentVal = ""; let inQuotes = false;
                for (let i=0; i<text.length; i++) {
                    const char = text[i];
                    if (char === '"') inQuotes = !inQuotes;
                    else if (char === ',' && !inQuotes) { values.push(currentVal); currentVal = ""; }
                    else currentVal += char;
                }
                values.push(currentVal); return values;
            }

            // On récupère les titres (première ligne)
            const headers = parseLine(rows[0]).map(h => h.trim().replace(/^"|"$/g, ''));
            const result = [];
            
            // On parcourt tout le reste
            for (let i=1; i<rows.length; i++) {
                const rowStr = rows[i].trim(); if(!rowStr) continue;
                const values = parseLine(rowStr); const obj = {};
                headers.forEach((h, i) => {
                    let val = values[i] ? values[i].trim() : "";
                    val = val.replace(/^"|"$/g, '').replace(/""/g, '"'); // Nettoyage
                    obj[h] = val;
                });
                result.push(obj);
            }
            return { data: result, columns: headers };
        }

        // On attend que le HTML soit prêt avant d'attacher les événements (clics, chargement...)
        document.addEventListener('DOMContentLoaded', () => {
            const fileInput = document.getElementById("csvFileInput");
            const searchInput = document.getElementById("searchBar");
            const btnPrev = document.getElementById("btnPrev");
            const btnNext = document.getElementById("btnNext");

            // Si le champ d'upload existe, on écoute le changement
            if(fileInput) {
                fileInput.addEventListener("change", function(e) {
                    const file = e.target.files[0]; if(!file) return;
                    const reader = new FileReader();
                    reader.readAsText(file);
                    reader.onload = function(evt) {
                        const parsed = csvToJson(evt.target.result);
                        allData = parsed.data; columns = parsed.columns;
                        
                        // On sauvegarde dans la session pour les graphiques (page stats)
                        try {
                            sessionStorage.setItem('myDashboardData', JSON.stringify(allData));
                            alert("C'est chargé !");
                        } catch(err) {
                            // Gestion d'erreur si le fichier est trop gros
                            try {
                                const sample = allData.slice(0, 5000);
                                sessionStorage.setItem('myDashboardData', JSON.stringify(sample));
                                alert("Fichier un peu lourd : On sauvegarde une partie pour les stats.");
                            } catch(e2) {}
                        }
                        if(allData.length > 0) { filteredData = [...allData]; updateTable(); }
                    };
                });
            }

            // Recherche dynamique
            if(searchInput) {
                searchInput.addEventListener("keyup", function(e) {
                    const txt = e.target.value.toLowerCase();
                    filteredData = allData.filter(r => Object.values(r).some(v => String(v).toLowerCase().includes(txt)));
                    state.page = 1; updateTable();
                });
            }

            // Pagination
            if(btnPrev) btnPrev.addEventListener("click", () => changePage(-1));
            if(btnNext) btnNext.addEventListener("click", () => changePage(1));
            
            // Si on revient sur la page, on recharge les données qu'on avait
            const saved = sessionStorage.getItem('myDashboardData');
            if(saved) { 
                try { allData = JSON.parse(saved); columns = Object.keys(allData[0]); filteredData=[...allData]; updateTable(); } 
                catch(e){} 
            }
        });

        function changePage(d) {
            const max = Math.ceil(filteredData.length/state.rowsPerPage);
            if(state.page+d >= 1 && state.page+d <= max) { state.page+=d; updateTable(); }
        }

        // Tri des colonnes (nombres ou texte)
        function sortData(col) {
            if (state.sortCol === col) state.sortAsc = !state.sortAsc; 
            else { state.sortCol = col; state.sortAsc = true; }
            filteredData.sort((a, b) => {
                let valA = a[col]||"", valB = b[col]||"";
                const numA = parseFloat(valA), numB = parseFloat(valB);
                if (!isNaN(numA) && !isNaN(numB)) return state.sortAsc ? numA-numB : numB-numA;
                return state.sortAsc ? String(valA).localeCompare(String(valB)) : String(valB).localeCompare(String(valA));
            });
            updateTable();
        }

        // Fonction d'affichage du tableau HTML
        function updateTable() {
            const container = document.getElementById("tableauContainer");
            const pag = document.getElementById("paginationControls");
            
            if(filteredData.length===0) { container.innerHTML="<p style='text-align:center; padding:20px'>Aucune donnée.</p>"; pag.style.display="none"; return; }
            pag.style.display="flex";
            
            const start=(state.page-1)*state.rowsPerPage;
            const data=filteredData.slice(start, start+state.rowsPerPage);
            const total=Math.ceil(filteredData.length/state.rowsPerPage);
            document.getElementById("pageInfo").innerText = `Page ${state.page} / ${total}`;
            
            // On reconstruit le tableau de zéro
            container.innerHTML = "";
            const table = document.createElement("table");
            const thead = document.createElement("thead");
            const tbody = document.createElement("tbody");
            const trHead = document.createElement("tr");

            columns.forEach(col => {
                const th = document.createElement("th");
                th.textContent = col + (col === state.sortCol ? (state.sortAsc ? " ▲" : " ▼") : "");
                th.style.cursor = "pointer";
                th.addEventListener("click", () => sortData(col));
                trHead.appendChild(th);
            });
            thead.appendChild(trHead);

            data.forEach(row => {
                const tr = document.createElement("tr");
                columns.forEach(col => {
                    const td = document.createElement("td");
                    let val = row[col] || "";
                    // On coupe si c'est trop long
                    if(val.length > 50 && !val.startsWith("http")) val = val.substring(0,50)+"...";
                    td.textContent = val;
                    tr.appendChild(td);
                });
                tbody.appendChild(tr);
            });
            table.appendChild(thead); table.appendChild(tbody); container.appendChild(table);
        }
    </script>
</body>
</html>
