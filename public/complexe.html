<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analyse Complexe</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="dashboard-page">

    <div class="sidebar">
        <h2>Menu Admin</h2>
        <nav>
            <a href="projet.html">📊 Données CSV</a>
            <a href="stats.html">📈 Statistiques</a>
            <a href="complexe.html" class="active">🌟 Données membres</a>
            <a href="param.html">⚙️ Paramètres</a>
        </nav>
    </div>

    <main class="main-content">
        <div class="table-page-container">
            <h1 class="page-title">Les animés avec le plus de membres !</h1>

            <div id="dashboardContent">
                <div class="chart-card" style="width: 100%; min-height: 600px; justify-content: center;">
                    <div id="zoneGraphique" style="width: 100%; height: 100%; display:flex; align-items:center; justify-content:center; background:#2c3e50; border-radius:10px; margin:10px;">
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // --- 1. SÉCURITÉ ADMIN ---
        fetch('/api/session').then(r=>r.json()).then(d => {
            if(!d.loggedIn || d.user.role !== 'admin') window.location.href='accueil.html';
        });

        // --- 2. CODE D3 BULLES ---
        const saved = sessionStorage.getItem('myDashboardData');
        if (saved) {
            const allData = JSON.parse(saved);
            if (allData.length > 0) {
                 bubbleGraph(allData);
            }
        } else {
            document.getElementById("zoneGraphique").innerText = "Chargez le CSV d'abord.";
        }

        function bubbleGraph(dataSource) {
            const width = 1000; 
            const height = 800;
            const padding = 40;

            // Trier et garder le top 50
            const triMembers = dataSource.sort((a, b) => b.Members - a.Members).slice(0, 50);

            const pack = d3.pack().size([width - padding, height - padding]).padding(5);
            const hierarchy = d3.hierarchy({children: triMembers})
                .sum(d => Math.pow(d.Members, 3)); // Accentuer les différences

            const root = pack(hierarchy);

            // Création SVG
            d3.select("#zoneGraphique").html(""); 
            const svg = d3.select("#zoneGraphique")
                .append("svg")
                .attr("width", width).attr("height", height)
                .attr("viewBox", `0 0 ${width} ${height}`)
                .style("max-width", "100%").style("height", "auto");

            // --- PATTERNS (IMAGES) ---
            const defs = svg.append("defs");
            defs.selectAll("pattern")
                .data(root.descendants().slice(1))
                .enter().append("pattern")
                .attr("id", (d, i) => "img-pattern-" + i)
                .attr("height", "100%").attr("width", "100%")
                .attr("patternContentUnits", "objectBoundingBox")
                .append("image")
                .attr("height", 1).attr("width", 1)
                .attr("preserveAspectRatio", "xMidYMid slice")
                .attr("xlink:href", d => d.data.image); // Colonne Image du CSV

            // --- BULLES ---
            const bubbles = svg.selectAll(".bubble")
                .data(root.descendants().slice(1))
                .enter().append("g")
                .attr("class", "bubble")
                .attr("transform", d => `translate(${d.x + padding / 2}, ${d.y + padding / 2})`)
                .on("mouseover", function(event, d) {
                    d3.select(this).raise()
                      .transition().duration(100)
                      .attr("transform", `translate(${d.x + padding / 2}, ${d.y + padding / 2}) scale(1.2)`);
                    d3.select(this).select("circle:nth-of-type(2)") // Le voile noir
                      .transition().duration(100).style("opacity", 0);
                })
                .on("mouseout", function(event, d) {
                    d3.select(this).transition().duration(100)
                      .attr("transform", `translate(${d.x + padding / 2}, ${d.y + padding / 2}) scale(1)`);
                    d3.select(this).select("circle:nth-of-type(2)")
                      .transition().duration(100).style("opacity", 0.4);
                });

            // Fond Image
            bubbles.append("circle")
                .attr("r", d => d.r)
                .style("fill", (d, i) => `url(#img-pattern-${i})`)
                .style("stroke", "white").style("stroke-width", 2);

            // Voile Noir
            bubbles.append("circle")
                .attr("r", d => d.r)
                .style("fill", "black").style("opacity", 0.4);

            // Infobulle native
            bubbles.append("title")
                .text(d => `${d.data.title}\nMembres : ${Math.round(d.data.Members).toLocaleString()}`);

            // Textes
            const textGroup = bubbles.append("text")
                .attr("dy", "-0.4em")
                .style("text-anchor", "middle")
                .style("fill", "white")
                .style("font-size", d => Math.min(d.r / 3, 12) + "px")
                .style("pointer-events", "none");

            textGroup.append("tspan")
                .attr("x", 0).attr("dy", "0em")
                .text(d => d.data.title.substring(0, 15) + "...");

            textGroup.append("tspan")
                .attr("x", 0).attr("dy", "1.2em")
                .text(d => Math.round(d.data.Members).toLocaleString());
        }
    </script>
</body>
</html>
