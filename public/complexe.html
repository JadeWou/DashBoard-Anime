<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analyse Complexe</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="dashboard-page">

    <div class="sidebar">
        <h2>Menu</h2>
        <nav>
            <a href="projet.html">📊 Données CSV</a>
            <a href="stats.html">📈 Statistiques</a>
            <a href="complexe.html">🌟 Données membres</a>
            <a href="param.html">⚙️ Paramètres</a>
        </nav>
    </div>

    <main class="main-content">
        <div class="table-page-container">
            <h1 class="page-title">Les animés avec le plus de membres !</h1>

            <div id="dashboardContent">
                                       
                    <div id="zoneGraphique" style="width: 100%; height: 100%; display:flex; align-items:center; justify-content:center; background:#2c3e50; border-radius:10px; margin:10px;">
                    </div>

            </div>
        </div>
    </main>

    <script>

        // Recup data session (fonnées et user)
        const saved = sessionStorage.getItem('myDashboardData');
        
        const allData = JSON.parse(saved);
            if (allData.length > 0) {
                bubbleGraph(allData);
            }

        
        function bubbleGraph(dataSource) {
    // 1. Dimensions
    // J'ai réduit un peu la taille pour que ça rentre mieux, mais vous pouvez remettre 1680/1050
    const width = 1000; 
    const height = 800;
    const padding = 40;

    // Trier et garder le top 30
    const triMembers = dataSource.sort((a, b) => b.Members - a.Members).slice(0, 50);

    // 2. Layout Pack
    const pack = d3.pack()
        .size([width - padding, height - padding])
        .padding(5);

    // Create the hierarchy from the data TRICHE POUR TAILLE DES BULLES
    const hierarchy = d3.hierarchy({children: triMembers})
    // AVANT : .sum(d => d.Members) 
    // APRES : On met au carré (Math.pow) pour accentuer les différences
    .sum(d => Math.pow(d.Members, 3));

    const root = pack(hierarchy);

    // 3. Création du SVG (CORRECTION MAJEURE ICI)
    // On vide d'abord la zone au cas où on redessine
    d3.select("#zoneGraphique").html(""); 

    const svg = d3.select("#zoneGraphique")
        .append("svg") // On CRÉE le SVG
        .attr("width", width)
        .attr("height", height)
        .attr("viewBox", `0 0 ${width} ${height}`) // Rend le graph responsive
        .style("max-width", "100%")
        .style("height", "auto");

    // 4. Création des groupes (bulles)
   // A METTRE DANS VOTRE FONCTION bubbleGraph

    // 1. Définir les "Patterns" (les textures d'images)
    // On crée une balise <defs> cachée qui contient les recettes des images
    const defs = svg.append("defs");
    
    defs.selectAll("pattern")
        .data(root.descendants().slice(1))
        .enter()
        .append("pattern")
        .attr("id", (d, i) => "img-pattern-" + i) // ID unique par bulle
        .attr("height", "100%")
        .attr("width", "100%")
        .attr("patternContentUnits", "objectBoundingBox")
        .append("image")
        .attr("height", 1)  
        .attr("width", 1)
        .attr("preserveAspectRatio", "xMidYMid slice") // Coupe l'image proprement (crop)
        .attr("xlink:href", d => d.data.image); // VOTRE COLONNE IMAGE

    // 2. Créer les bulles
    const bubbles = svg.selectAll(".bubble")
        .data(root.descendants().slice(1))
        .enter()
        .append("g")
        .attr("class", "bubble")
        .attr("transform", d => `translate(${d.x + padding / 2}, ${d.y + padding / 2})`)
        // ... (votre code précédent : attr transform ...)
        
        .on("mouseover", function(event, d) {
            // 1. On met la bulle au premier plan
            d3.select(this).raise(); 
            
            // 2. On lance la transition de GROSSISSEMENT
            d3.select(this)
                .transition()
                .duration(100) // 100ms = Très réactif (presque instantané)
                .attr("transform", `translate(${d.x + padding / 2}, ${d.y + padding / 2}) scale(1.2)`);

            // 3. On ÉCLAIRCIT l'image (en ciblant le voile noir)
            // On sélectionne le 2ème cercle (le voile noir) à l'intérieur de la bulle survolée
            d3.select(this).select("circle:nth-of-type(2)")
                .transition()
                .duration(100) // Même vitesse que le zoom
                .style("opacity", 0); // 0 = Transparent (Image totalement claire)
        })
        .on("mouseout", function(event, d) {
            // 1. Retour à la taille normale
            d3.select(this)
                .transition()
                .duration(100)
                .attr("transform", `translate(${d.x + padding / 2}, ${d.y + padding / 2}) scale(1)`);
            
            // 2. Retour à l'image SOMBRE
            d3.select(this).select("circle:nth-of-type(2)")
                .transition()
                .duration(100)
                .style("opacity", 0.4); // On remet le voile noir
        });


    // 3. Appliquer l'image comme "Couleur de fond" (fill)
    bubbles.append("circle")
        .attr("r", d => d.r)
        .style("fill", (d, i) => `url(#img-pattern-${i})`) // On appelle le pattern créé plus haut
        .style("stroke", "white")
        .style("stroke-width", 2);

    // 4. Ajouter un voile noir (Overlay) pour que le texte blanc se voit
    bubbles.append("circle")
        .attr("r", d => d.r)
        .style("fill", "black")
        .style("opacity", 0.4); // 40% de noir par dessus l'image

    // 5. Ensuite, ajoutez votre code pour le TEXTE ici...

    //INFOBULLE AU PASSAGE DE LA SOURIS !
    bubbles.append("title")
    .text(d => `${d.data.title}\nMembres : ${d.data.Members.toLocaleString('fr-FR')}`);

    // 6. Textes
    const textGroup = bubbles.append("text")
        .attr("dy", "-0.4em")
        .style("text-anchor", "middle")
        .style("fill", "white") // Texte en blanc pour contraste sur fond vert
        .style("font-size", d => Math.min(d.r / 3, 12) + "px") // Taille adaptative simple
        .style("pointer-events", "none"); // Pour ne pas gêner la souris

    // Titre de l'animé
    textGroup.append("tspan")
        .attr("class", "titre")
        .attr("x", 0)
        .attr("dy", "0em")
        .text(d => d.data.title.substring(0, 20) + (d.data.title.length > 20 ? "..." : ""));

    // Nombre de membres
    textGroup.append("tspan")
        .attr("class", "members")
        .attr("x", 0)
        .attr("dy", "1.2em")
        .text(d => Math.round(d.data.Members).toLocaleString());; // CORRECTION : d.data.Members
}

    </script>

</body>
</html>
