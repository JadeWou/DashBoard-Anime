<script>
        // --- SÉCURITÉ CÔTÉ CLIENT ---
        fetch('/api/session').then(r=>r.json()).then(d => {
            // Si le serveur dit qu'on n'est pas connecté, on renvoie à l'accueil
            if(!d.loggedIn) window.location.href='accueil.html';
            
            // Si on n'est pas admin, on cache le lien vers la page complexe
            if(d.user.role !== 'admin') document.getElementById('linkComplexe').style.display='none';
        });

        // --- GRAPHIQUES D3 ---
        // On récupère les données CSV qu'on a stockées dans le navigateur
        const saved = sessionStorage.getItem('myDashboardData');
        
        if (saved) {
             const allData = JSON.parse(saved);
             if (allData.length > 0) graphiqueGenre(allData);
        } else {
             document.getElementById("dashboardContent").innerHTML = "<p style='text-align:center'>Il faut charger un fichier CSV dans l'onglet 'Données CSV' d'abord !</p>";
        }

        function graphiqueGenre(data) {
            // 1. Préparation des données : On compte combien d'animés par genre
            const nbGenre = {};
            data.forEach(item => {
                // On cherche la colonne qui contient "Genre" ou "Genres"
                const key = Object.keys(item).find(k => k.toLowerCase().includes("genre"));
                if (key && item[key]) {
                    // On sépare les genres (ex: "Action, Comedy" -> "Action" et "Comedy")
                    item[key].replace(/"/g, '').split(',').forEach(g => {
                        const clean = g.trim();
                        if (clean) nbGenre[clean] = (nbGenre[clean] || 0) + 1;
                    });
                }
            });

            // On garde seulement les 8 genres les plus fréquents pour pas surcharger le camembert
            const chartData = Object.entries(nbGenre)
                .sort((a, b) => b[1] - a[1]) // Tri décroissant
                .slice(0, 8)
                .map(([label, value]) => ({ label, value }));

            // 2. Dessin avec D3.js
            const width = 400;
            const height = 300;
            const margin = 20;
            const radius = Math.min(width, height) / 2 - margin;
            
            const svg = d3.select("#graphGenre").append("svg")
                .attr("width", width)
                .attr("height", height)
                .append("g")
                .attr("transform", `translate(${width/2 - 60}, ${height/2})`); // On centre le dessin

            const color = d3.scaleOrdinal(d3.schemeSet2); // Palette de couleurs auto
            const pie = d3.pie().value(d => d.value);
            const data_ready = pie(chartData);
            const arc = d3.arc().innerRadius(0).outerRadius(radius);

            // Dessin des parts du camembert
            svg.selectAll('path').data(data_ready).enter().append('path')
              .attr('d', arc).attr('fill', d => color(d.data.label))
              .attr("stroke", "white").style("stroke-width", "2px").style("opacity", 0.9)
              // Petit effet quand on passe la souris
              .on("mouseover", function() { d3.select(this).style("opacity", 1); })
              .on("mouseout", function() { d3.select(this).style("opacity", 0.9); });

            // Ajout de la légende à droite
            const legend = svg.append("g").attr("transform", `translate(${radius + 10}, -${radius})`);
            chartData.forEach((d, i) => {
                const row = legend.append("g").attr("transform", `translate(0, ${i * 25})`);
                row.append("rect").attr("width", 15).attr("height", 15).attr("fill", color(d.label));
                row.append("text").attr("x", 20).attr("y", 12).text(`${d.label} (${d.value})`)
                   .style("font-size", "13px").style("font-family", "sans-serif").attr("alignment-baseline", "middle");
            });
        }
    </script>
